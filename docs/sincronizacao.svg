<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1350" width="1400" height="1350" role="img" aria-label="Fluxo de sincronização offline do MedicalField">
<style>:root{--body:"Atkinson Hyperlegible Next","Segoe UI",Arial,sans-serif;--mono:"Atkinson Hyperlegible Mono",Consolas,monospace}</style>
<defs>
<marker id="ponta" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#AEB9C6"/></marker>
<filter id="sombra" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A3A" flood-opacity=".09"/></filter>
<pattern id="listras" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#E0A100"/><rect width="7" height="14" fill="#1F2933"/></pattern>
</defs>
<rect width="1400" height="1350" fill="#F5F7FA"/>
<text x="700.0" y="60" font-size="34" font-weight="700" fill="#16202C" text-anchor="middle" style="font-family:var(--body)">Sincronização offline</text>
<text x="700.0" y="94" font-size="18" font-weight="400" fill="#64707F" text-anchor="middle" style="font-family:var(--body)">O socorrista trabalha sem internet. Quando a rede volta, tudo vai sozinho para a central.</text>
<circle cx="240.0" cy="158" r="24" fill="#3178C6" fill-opacity=".14"/>
<rect x="231.0" y="143" width="18" height="30" rx="4" fill="none" stroke="#3178C6" stroke-width="2.5"/>
<text x="278.0" y="154" font-size="22" font-weight="700" fill="#16202C" text-anchor="start" style="font-family:var(--body)">Celular</text>
<text x="278.0" y="178" font-size="14.5" font-weight="400" fill="#64707F" text-anchor="start" style="font-family:var(--body)">cliente do socorrista</text>
<circle cx="940.0" cy="158" r="24" fill="#17A34A" fill-opacity=".14"/>
<rect x="927.0" y="144" width="26" height="8" rx="2" fill="none" stroke="#17A34A" stroke-width="2.2"/>
<rect x="927.0" y="154" width="26" height="8" rx="2" fill="none" stroke="#17A34A" stroke-width="2.2"/>
<rect x="927.0" y="164" width="26" height="8" rx="2" fill="none" stroke="#17A34A" stroke-width="2.2"/>
<text x="978.0" y="154" font-size="22" font-weight="700" fill="#16202C" text-anchor="start" style="font-family:var(--body)">Central</text>
<text x="978.0" y="178" font-size="14.5" font-weight="400" fill="#64707F" text-anchor="start" style="font-family:var(--body)">clinical-service + PostgreSQL</text>
<path d="M700.0 130 V1320" stroke="#D5DCE5" stroke-width="2" stroke-dasharray="4 8"/>
<rect x="40" y="220" width="1320" height="370" rx="22" fill="#fff" fill-opacity=".55" stroke="#E3E8EF"/>
<rect x="64" y="238" width="202" height="36" rx="18" fill="url(#listras)"/>
<rect x="66" y="240" width="198" height="32" rx="16" fill="#E0A100"/>
<text x="92" y="262" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" style="font-family:var(--body)">1</text>
<text x="112" y="262" font-size="16" font-weight="700" fill="#fff" text-anchor="start" style="font-family:var(--body)">SEM INTERNET</text>
<rect x="80" y="298" width="540" height="74" rx="16" fill="#fff" filter="url(#sombra)"/>
<circle cx="120" cy="335.0" r="19" fill="#3178C6"/>
<text x="120" y="341.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" style="font-family:var(--body)">1</text>
<text x="156" y="330" font-size="18" font-weight="700" fill="#16202C" text-anchor="start" style="font-family:var(--body)">Salva no aparelho</text>
<text x="156" y="354" font-size="14.5" font-weight="400" fill="#64707F" text-anchor="start" style="font-family:var(--body)">IndexedDB + um pedido na fila (Outbox)</text>
<path d="M120 372 L120 393" stroke="#AEB9C6" stroke-width="2.5" fill="none" marker-end="url(#ponta)"/>
<rect x="80" y="396" width="540" height="74" rx="16" fill="#fff" filter="url(#sombra)"/>
<circle cx="120" cy="433.0" r="19" fill="#3178C6"/>
<text x="120" y="439.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" style="font-family:var(--body)">2</text>
<text x="156" y="428" font-size="18" font-weight="700" fill="#16202C" text-anchor="start" style="font-family:var(--body)">Confere as regras clínicas</text>
<text x="156" y="452" font-size="14.5" font-weight="400" fill="#64707F" text-anchor="start" style="font-family:var(--body)">via, dose máxima e alergia, sem internet</text>
<rect x="541.0" y="414" width="63.0" height="26" rx="13" fill="#3178C6" fill-opacity=".12"/>
<text x="572.5" y="432" font-size="13" font-weight="700" fill="#3178C6" text-anchor="middle" style="font-family:var(--mono)">Chain</text>
<path d="M120 470 L120 491" stroke="#AEB9C6" stroke-width="2.5" fill="none" marker-end="url(#ponta)"/>
<rect x="80" y="494" width="540" height="74" rx="16" fill="#fff" filter="url(#sombra)"/>
<circle cx="120" cy="531.0" r="19" fill="#3178C6"/>
<text x="120" y="537.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" style="font-family:var(--body)">3</text>
<text x="156" y="526" font-size="18" font-weight="700" fill="#16202C" text-anchor="start" style="font-family:var(--body)">Fica pendente</text>
<text x="156" y="550" font-size="14.5" font-weight="400" fill="#64707F" text-anchor="start" style="font-family:var(--body)">selo “Só no aparelho” · “3 pendentes”</text>
<rect x="780" y="298" width="540" height="270" rx="16" fill="none" stroke="#C9D2DD" stroke-width="2" stroke-dasharray="8 7"/>
<path d="M1016.0 412 a22 22 0 0 1 8 -36 a28 28 0 0 1 52 6 a18 18 0 0 1 8 30 z" fill="none" stroke="#B4BFCC" stroke-width="3"/>
<path d="M1010.0 424 L1090.0 360" stroke="#B4BFCC" stroke-width="3"/>
<text x="1050.0" y="462" font-size="18" font-weight="700" fill="#64707F" text-anchor="middle" style="font-family:var(--body)">A central não recebe nada</text>
<text x="1050.0" y="486" font-size="14.5" font-weight="400" fill="#64707F" text-anchor="middle" style="font-family:var(--body)">no portal, a vítima ainda não aparece</text>
<rect x="40" y="615" width="1320" height="470" rx="22" fill="#fff" fill-opacity=".55" stroke="#E3E8EF"/>
<rect x="64" y="633" width="246" height="36" rx="18" fill="#3178C6"/>
<text x="92" y="657" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" style="font-family:var(--body)">2</text>
<text x="112" y="657" font-size="16" font-weight="700" fill="#fff" text-anchor="start" style="font-family:var(--body)">A INTERNET VOLTA</text>
<rect x="80" y="693" width="540" height="74" rx="16" fill="#fff" filter="url(#sombra)"/>
<circle cx="120" cy="730.0" r="19" fill="#3178C6"/>
<text x="120" y="736.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" style="font-family:var(--body)">4</text>
<text x="156" y="725" font-size="18" font-weight="700" fill="#16202C" text-anchor="start" style="font-family:var(--body)">O monitor de rede avisa</text>
<text x="156" y="749" font-size="14.5" font-weight="400" fill="#64707F" text-anchor="start" style="font-family:var(--body)">o SyncEngine começa sozinho, sem clique</text>
<rect x="516.4" y="711" width="87.6" height="26" rx="13" fill="#3178C6" fill-opacity=".12"/>
<text x="560.2" y="729" font-size="13" font-weight="700" fill="#3178C6" text-anchor="middle" style="font-family:var(--mono)">Observer</text>
<path d="M120 767 L120 788" stroke="#AEB9C6" stroke-width="2.5" fill="none" marker-end="url(#ponta)"/>
<rect x="80" y="791" width="540" height="74" rx="16" fill="#fff" filter="url(#sombra)"/>
<circle cx="120" cy="828.0" r="19" fill="#3178C6"/>
<text x="120" y="834.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" style="font-family:var(--body)">5</text>
<text x="156" y="823" font-size="18" font-weight="700" fill="#16202C" text-anchor="start" style="font-family:var(--body)">Envia a fila em ordem</text>
<text x="156" y="847" font-size="14.5" font-weight="400" fill="#64707F" text-anchor="start" style="font-family:var(--body)">pessoa → prontuário → atendimento</text>
<rect x="524.6" y="809" width="79.39999999999999" height="26" rx="13" fill="#3178C6" fill-opacity=".12"/>
<text x="564.3" y="827" font-size="13" font-weight="700" fill="#3178C6" text-anchor="middle" style="font-family:var(--mono)">Command</text>
<rect x="780" y="791" width="540" height="74" rx="16" fill="#fff" filter="url(#sombra)"/>
<circle cx="820" cy="828.0" r="19" fill="#17A34A"/>
<text x="820" y="834.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" style="font-family:var(--body)">6</text>
<text x="856" y="823" font-size="18" font-weight="700" fill="#16202C" text-anchor="start" style="font-family:var(--body)">Já recebi este pedido?</text>
<text x="856" y="847" font-size="14.5" font-weight="400" fill="#64707F" text-anchor="start" style="font-family:var(--body)">sim: devolve a mesma resposta (não duplica)</text>
<rect x="1183.6" y="809" width="120.39999999999999" height="26" rx="13" fill="#17A34A" fill-opacity=".12"/>
<text x="1243.8" y="827" font-size="13" font-weight="700" fill="#17A34A" text-anchor="middle" style="font-family:var(--mono)">Idempotência</text>
<path d="M820 865 L820 886" stroke="#AEB9C6" stroke-width="2.5" fill="none" marker-end="url(#ponta)"/>
<rect x="780" y="889" width="540" height="74" rx="16" fill="#fff" filter="url(#sombra)"/>
<circle cx="820" cy="926.0" r="19" fill="#17A34A"/>
<text x="820" y="932.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" style="font-family:var(--body)">7</text>
<text x="856" y="921" font-size="18" font-weight="700" fill="#16202C" text-anchor="start" style="font-family:var(--body)">Houve conflito?</text>
<text x="856" y="945" font-size="14.5" font-weight="400" fill="#64707F" text-anchor="start" style="font-family:var(--body)">sim: a estratégia decide quem vence</text>
<rect x="1216.4" y="907" width="87.6" height="26" rx="13" fill="#17A34A" fill-opacity=".12"/>
<text x="1260.2" y="925" font-size="13" font-weight="700" fill="#17A34A" text-anchor="middle" style="font-family:var(--mono)">Strategy</text>
<path d="M820 963 L820 984" stroke="#AEB9C6" stroke-width="2.5" fill="none" marker-end="url(#ponta)"/>
<rect x="780" y="987" width="540" height="74" rx="16" fill="#fff" filter="url(#sombra)"/>
<circle cx="820" cy="1024.0" r="19" fill="#17A34A"/>
<text x="820" y="1030.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" style="font-family:var(--body)">8</text>
<text x="856" y="1019" font-size="18" font-weight="700" fill="#16202C" text-anchor="start" style="font-family:var(--body)">Grava e responde</text>
<text x="856" y="1043" font-size="14.5" font-weight="400" fill="#64707F" text-anchor="start" style="font-family:var(--body)">CRIADO · ATUALIZADO · MESCLADO</text>
<path d="M620 828 L776 828" stroke="#AEB9C6" stroke-width="2.5" fill="none" marker-end="url(#ponta)"/>
<text x="698.0" y="818" font-size="13" font-weight="700" fill="#64707F" text-anchor="middle" style="font-family:var(--mono)">POST</text>
<text x="700.0" y="848" font-size="12.5" font-weight="700" fill="#64707F" text-anchor="middle" style="font-family:var(--mono)">+ Idempotency-Key</text>
<path d="M780 1024 L624 1024" stroke="#AEB9C6" stroke-width="2.5" fill="none" marker-end="url(#ponta)"/>
<text x="702.0" y="1014" font-size="13" font-weight="700" fill="#64707F" text-anchor="middle" style="font-family:var(--mono)">resposta</text>
<rect x="80" y="987" width="540" height="74" rx="16" fill="#fff" filter="url(#sombra)"/>
<circle cx="120" cy="1024.0" r="19" fill="#3178C6"/>
<text x="120" y="1030.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" style="font-family:var(--body)">9</text>
<text x="156" y="1019" font-size="18" font-weight="700" fill="#16202C" text-anchor="start" style="font-family:var(--body)">Marca como sincronizado</text>
<text x="156" y="1043" font-size="14.5" font-weight="400" fill="#64707F" text-anchor="start" style="font-family:var(--body)">selo “Na central”</text>
<rect x="40" y="1110" width="1320" height="210" rx="22" fill="#fff" fill-opacity=".55" stroke="#E3E8EF"/>
<rect x="64" y="1128" width="257" height="36" rx="18" fill="#17A34A"/>
<text x="92" y="1152" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" style="font-family:var(--body)">3</text>
<text x="112" y="1152" font-size="16" font-weight="700" fill="#fff" text-anchor="start" style="font-family:var(--body)">RECEBER NOVIDADES</text>
<rect x="80" y="1188" width="540" height="74" rx="16" fill="#fff" filter="url(#sombra)"/>
<circle cx="120" cy="1225.0" r="19" fill="#3178C6"/>
<text x="120" y="1231.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" style="font-family:var(--body)">10</text>
<text x="156" y="1220" font-size="18" font-weight="700" fill="#16202C" text-anchor="start" style="font-family:var(--body)">Pede só o que mudou</text>
<text x="156" y="1244" font-size="14.5" font-weight="400" fill="#64707F" text-anchor="start" style="font-family:var(--body)">GET /sync/pull?cursor=N</text>
<rect x="780" y="1188" width="540" height="74" rx="16" fill="#fff" filter="url(#sombra)"/>
<circle cx="820" cy="1225.0" r="19" fill="#17A34A"/>
<text x="820" y="1231.0" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" style="font-family:var(--body)">11</text>
<text x="856" y="1220" font-size="18" font-weight="700" fill="#16202C" text-anchor="start" style="font-family:var(--body)">Devolve as mudanças</text>
<text x="856" y="1244" font-size="14.5" font-weight="400" fill="#64707F" text-anchor="start" style="font-family:var(--body)">tudo que mudou depois do cursor N</text>
<path d="M620 1212 L776 1212" stroke="#AEB9C6" stroke-width="2.5" fill="none" marker-end="url(#ponta)"/>
<path d="M780 1242 L624 1242" stroke="#AEB9C6" stroke-width="2.5" fill="none" marker-end="url(#ponta)"/>
<text x="156" y="1296" font-size="14.5" font-weight="400" fill="#64707F" text-anchor="start" style="font-family:var(--body)">O celular grava tudo e guarda o novo cursor para a próxima vez.</text>
</svg>
