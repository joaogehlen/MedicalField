# MedicalField — API Gateway (Nginx) na rede do Docker Compose.
# Os nomes "identity", "clinical", "document" e "email" são os serviços do docker-compose.yml.

upstream mf_identity { server identity:8081; }   # Java · Spring Boot
upstream mf_clinical { server clinical:3001; }   # TypeScript · NestJS
upstream mf_document { server document:8000; }   # Python · FastAPI

server {
  listen 80;
  server_name _;
  client_max_body_size 5m;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 60s;

  # Resolve os nomes dos containers na hora (sobe mesmo se um serviço ainda estiver iniciando)
  resolver 127.0.0.11 valid=10s ipv6=off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # identity-service: login, profissionais e logs do aparelho
  location ~ ^/api/(auth|profissional|log)(/.*)?$ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://mf_identity;
  }

  # document-service: ficha em PDF e e-mail
  location ^~ /api/ficha/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://mf_document;
  }

  # clinical-service: demais rotas da API
  location /api/ {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://mf_clinical;
  }

  # Caixa de e-mails da demonstração (Mailpit)
  location = /email { return 301 /email/; }
  location /email/ {
    set $mailpit http://email:8025;
    proxy_pass $mailpit;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # Telas
  root /usr/share/nginx/html;
  location = /app { return 301 /app/; }
  location /app/ { try_files $uri $uri/ /app/index.html; }
  location = /portal { return 301 /portal/; }
  location /portal/ { try_files $uri $uri/ /portal/index.html; }
  location = / { return 302 /portal/; }
}
